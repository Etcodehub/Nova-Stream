<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>NOVA STREAM - Live Sports & World Football</title>
  <meta name="description" content="Watch SuperSport, Sky Sports, TNT Sports, beIN Sports, and 75+ premium world sports channels live in HD/4K." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">
  
  <!-- Inter Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- HLS.js for .m3u8 live video streams -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
  
  <!-- Phosphor Icons -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>

  <style>
    :root {
      --bg-darkest: #07090e;
      --bg-main: #0c1017;
      --bg-card: #131924;
      --bg-card-hover: #1c2434;
      --bg-card-active: #182844;
      --border-subtle: #1e293b;
      --border-active: #0284c7;
      --primary: #0284c7;
      --primary-glow: rgba(2, 132, 199, 0.35);
      --accent: #38bdf8;
      --gold: #f59e0b;
      --gold-glow: rgba(245, 158, 11, 0.3);
      --live-red: #ef4444;
      --emerald: #10b981;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --font-display: 'Outfit', sans-serif;
      --font-body: 'Inter', sans-serif;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-darkest);
      color: var(--text-main);
      font-family: var(--font-body);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* Header */
    header {
      background: rgba(12, 16, 23, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-subtle);
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.75rem 1.5rem;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      text-decoration: none;
      color: inherit;
    }

    .brand-logo {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: linear-gradient(135deg, #0284c7, #2563eb, #7c3aed);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 18px var(--primary-glow);
    }

    .brand-logo i {
      font-size: 1.25rem;
      color: #fff;
    }

    .brand-title {
      font-family: var(--font-display);
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      background: linear-gradient(180deg, #ffffff 30%, #94a3b8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-tag {
      background: rgba(2, 132, 199, 0.2);
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: #38bdf8;
      font-size: 0.65rem;
      font-weight: 700;
      padding: 0.15rem 0.45rem;
      border-radius: 6px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .stat-badge {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.25);
      color: #10b981;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 0.35rem 0.75rem;
      border-radius: 999px;
    }

    .pulse-dot {
      width: 7px;
      height: 7px;
      background: #10b981;
      border-radius: 50%;
      animation: pulse 1.6s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.9); opacity: 0.8; box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
      70% { transform: scale(1.1); opacity: 1; box-shadow: 0 0 0 7px rgba(16, 185, 129, 0); }
      100% { transform: scale(0.9); opacity: 0.8; box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
    }

    /* Main Container */
    .app-layout {
      display: grid;
      grid-template-columns: 1fr 420px;
      flex: 1;
      height: calc(100vh - 61px);
      overflow: hidden;
    }

    /* Left: Player Stage */
    .stage-section {
      display: flex;
      flex-direction: column;
      background: var(--bg-darkest);
      overflow-y: auto;
      padding: 1.25rem;
      gap: 1rem;
    }

    .player-card {
      background: #000;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid var(--border-subtle);
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.6);
      position: relative;
    }

    .player-aspect {
      position: relative;
      width: 100%;
      padding-top: 56.25%; /* 16:9 Aspect Ratio */
      background: #000;
    }

    .player-element {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
      background: #000;
    }

    .player-loading-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(7, 9, 14, 0.85);
      backdrop-filter: blur(8px);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      z-index: 10;
    }

    .spinner {
      width: 44px;
      height: 44px;
      border: 3px solid rgba(2, 132, 199, 0.2);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Stream Metadata Bar */
    .stream-meta-bar {
      background: var(--bg-main);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 1rem 1.25rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .stream-details {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    .stream-title-row {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      flex-wrap: wrap;
    }

    .stream-channel-name {
      font-family: var(--font-display);
      font-size: 1.25rem;
      font-weight: 700;
      color: #fff;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      font-size: 0.7rem;
      font-weight: 700;
      padding: 0.2rem 0.5rem;
      border-radius: 6px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .badge-network {
      background: rgba(2, 132, 199, 0.2);
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: #38bdf8;
    }

    .badge-quality {
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid rgba(245, 158, 11, 0.3);
      color: #fbbf24;
    }

    .badge-live {
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #f87171;
    }

    .stream-subtitle {
      font-size: 0.85rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .stream-actions {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .btn-icon {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      color: var(--text-muted);
      width: 40px;
      height: 40px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.15rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-icon:hover {
      background: var(--bg-card-hover);
      color: var(--text-main);
      border-color: var(--primary);
    }

    .btn-icon.active {
      background: rgba(245, 158, 11, 0.15);
      color: var(--gold);
      border-color: rgba(245, 158, 11, 0.4);
    }

    /* Top Highlights Section */
    .top-picks-banner {
      background: linear-gradient(135deg, rgba(2, 132, 199, 0.12), rgba(124, 58, 237, 0.08));
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 12px;
      padding: 0.9rem 1.1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .top-picks-info {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .top-picks-icon {
      font-size: 1.5rem;
      color: var(--gold);
    }

    .top-picks-text h4 {
      font-family: var(--font-display);
      font-size: 0.95rem;
      font-weight: 700;
      color: #fff;
    }

    .top-picks-text p {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    /* Right: Channel Browser */
    .catalog-section {
      background: var(--bg-main);
      border-left: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      height: 100%;
    }

    /* Search & Filter Header */
    .search-box-wrap {
      padding: 1rem 1.15rem 0.75rem;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .search-input-group {
      position: relative;
      display: flex;
      align-items: center;
    }

    .search-input-group i {
      position: absolute;
      left: 0.85rem;
      color: var(--text-dim);
      font-size: 1.1rem;
    }

    .search-input {
      width: 100%;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      padding: 0.65rem 0.85rem 0.65rem 2.4rem;
      color: #fff;
      font-family: var(--font-body);
      font-size: 0.85rem;
      outline: none;
      transition: all 0.2s ease;
    }

    .search-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-glow);
    }

    .clear-search-btn {
      position: absolute;
      right: 0.75rem;
      background: none;
      border: none;
      color: var(--text-dim);
      font-size: 1rem;
      cursor: pointer;
      display: none;
    }

    /* Category Filter Tabs */
    .category-scroll {
      display: flex;
      gap: 0.4rem;
      overflow-x: auto;
      padding-bottom: 0.25rem;
      scrollbar-width: none;
    }

    .category-scroll::-webkit-scrollbar {
      display: none;
    }

    .cat-chip {
      white-space: nowrap;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      color: var(--text-muted);
      padding: 0.4rem 0.75rem;
      border-radius: 8px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }

    .cat-chip:hover {
      background: var(--bg-card-hover);
      color: #fff;
    }

    .cat-chip.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--accent);
      box-shadow: 0 2px 10px var(--primary-glow);
    }

    /* Channel List */
    .channel-list {
      flex: 1;
      overflow-y: auto;
      padding: 0.85rem 1.15rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .channel-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      padding: 0.75rem 0.95rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: all 0.18s ease;
      position: relative;
      overflow: hidden;
    }

    .channel-card:hover {
      background: var(--bg-card-hover);
      border-color: rgba(56, 189, 248, 0.4);
      transform: translateY(-1px);
    }

    .channel-card.active {
      background: var(--bg-card-active);
      border-color: var(--primary);
      box-shadow: 0 0 16px rgba(2, 132, 199, 0.25);
    }

    .channel-card.active::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 3px;
      background: var(--accent);
    }

    .card-left {
      display: flex;
      align-items: center;
      gap: 0.85rem;
      overflow: hidden;
    }

    .network-badge-box {
      width: 44px;
      height: 44px;
      min-width: 44px;
      border-radius: 10px;
      background: linear-gradient(135deg, #172133, #0f172a);
      border: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 0.75rem;
      color: #38bdf8;
      text-transform: uppercase;
      letter-spacing: -0.02em;
    }

    .card-meta {
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
      overflow: hidden;
    }

    .card-title {
      font-size: 0.88rem;
      font-weight: 600;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-subtitle {
      font-size: 0.72rem;
      color: var(--text-dim);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-right {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      min-width: fit-content;
    }

    .card-fav-btn {
      background: none;
      border: none;
      color: var(--text-dim);
      font-size: 1.15rem;
      cursor: pointer;
      padding: 0.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
    }

    .card-fav-btn:hover,
    .card-fav-btn.is-fav {
      color: var(--gold);
    }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 3rem 1rem;
      text-align: center;
      gap: 0.75rem;
      color: var(--text-dim);
    }

    .empty-state i {
      font-size: 2.5rem;
    }

    /* Mobile Responsive */
    @media (max-width: 900px) {
      .app-layout {
        grid-template-columns: 1fr;
        height: auto;
        overflow-y: auto;
      }

      .stage-section {
        padding: 0.75rem;
        position: sticky;
        top: 61px;
        z-index: 50;
        background: var(--bg-darkest);
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.7);
      }

      .catalog-section {
        height: auto;
        border-left: none;
        border-top: 1px solid var(--border-subtle);
      }

      .channel-list {
        max-height: 60vh;
      }
    }
  </style>
</head>
<body>

  <!-- Top Navigation Bar -->
  <header>
    <a href="/" class="brand">
      <div class="brand-logo">
        <i class="ph-bold ph-lightning"></i>
      </div>
      <div>
        <span class="brand-title">NOVA STREAM</span>
      </div>
      <span class="brand-tag">PRO</span>
    </a>

    <div class="header-actions">
      <div class="stat-badge">
        <span class="pulse-dot"></span>
        <span id="channel-count-badge">79 LIVE</span>
      </div>
    </div>
  </header>

  <!-- Main App Layout -->
  <div class="app-layout">
    
    <!-- Left Stage: Video Player & Controls -->
    <main class="stage-section">
      
      <!-- Video Player Viewport -->
      <div class="player-card" id="player-container">
        <div class="player-aspect">
          
          <!-- Direct HLS Native/JS Player -->
          <video 
            id="hls-video" 
            class="player-element" 
            controls 
            playsinline 
            autoplay 
            style="display: none;">
          </video>

          <!-- Iframe Embed Stream Player -->
          <iframe 
            id="embed-frame" 
            class="player-element" 
            allow="autoplay; fullscreen; encrypted-media; picture-in-picture" 
            allowfullscreen 
            sandbox="allow-forms allow-scripts allow-same-origin allow-popups"
            style="display: block;">
          </iframe>

          <!-- Loading State Overlay -->
          <div id="player-loader" class="player-loading-overlay">
            <div class="spinner"></div>
            <p style="font-size: 0.85rem; font-weight: 600; color: #94a3b8;">Connecting to live feed...</p>
          </div>

        </div>
      </div>

      <!-- Current Playing Metadata Bar -->
      <div class="stream-meta-bar">
        <div class="stream-details">
          <div class="stream-title-row">
            <span id="now-playing-title" class="stream-channel-name">SuperSport Premier League</span>
            <span id="now-playing-network" class="badge badge-network">SuperSport</span>
            <span id="now-playing-quality" class="badge badge-quality">4K</span>
            <span class="badge badge-live">LIVE</span>
          </div>
          <div id="now-playing-subtitle" class="stream-subtitle">
            <i class="ph ph-broadcast"></i>
            <span>Premier League Live • Feature Match</span>
          </div>
        </div>

        <div class="stream-actions">
          <button id="btn-reload" class="btn-icon" title="Reload Stream">
            <i class="ph-bold ph-arrows-clockwise"></i>
          </button>
          <button id="btn-theater" class="btn-icon" title="Toggle Fullscreen">
            <i class="ph-bold ph-corners-out"></i>
          </button>
          <button id="btn-favorite" class="btn-icon" title="Save Favorite">
            <i class="ph-bold ph-star"></i>
          </button>
        </div>
      </div>

      <!-- Matchday Spotlight Banner -->
      <div class="top-picks-banner">
        <div class="top-picks-info">
          <i class="ph-fill ph-trophy top-picks-icon"></i>
          <div class="top-picks-text">
            <h4>Football Matchday Feeds Active</h4>
            <p>SuperSport, Sky Sports, TNT, and beIN feeds are tuned to the best European football matches.</p>
          </div>
        </div>
      </div>

    </main>

    <!-- Right Drawer: Channel Catalog -->
    <aside class="catalog-section">
      
      <!-- Search & Filters -->
      <div class="search-box-wrap">
        <div class="search-input-group">
          <i class="ph ph-magnifying-glass"></i>
          <input 
            type="text" 
            id="channel-search" 
            class="search-input" 
            placeholder="Search channels, leagues, networks..." 
            autocomplete="off"
          />
          <button id="clear-search" class="clear-search-btn">
            <i class="ph-bold ph-x"></i>
          </button>
        </div>

        <!-- Category Horizontal Tabs -->
        <div class="category-scroll" id="category-tabs">
          <button class="cat-chip active" data-category="Top 10 Matches">
            <i class="ph-fill ph-star" style="color:#f59e0b;"></i> Top 10 Matches
          </button>
          <button class="cat-chip" data-category="ALL">All Channels</button>
          <button class="cat-chip" data-category="Premier Sports">Premier Sports</button>
          <button class="cat-chip" data-category="Football Feeds">Football Feeds</button>
          <button class="cat-chip" data-category="Combat & Racing">Combat & Racing</button>
          <button class="cat-chip" data-category="US Leagues">US Leagues</button>
          <button class="cat-chip" data-category="24/7 News">24/7 News</button>
          <button class="cat-chip" data-category="Docs & Cinema">Docs & Cinema</button>
          <button class="cat-chip" data-category="Favorites">
            <i class="ph-fill ph-heart" style="color:#ef4444;"></i> Favorites
          </button>
        </div>
      </div>

      <!-- Channel List Items -->
      <div class="channel-list" id="channel-container">
        <!-- Rendered via JavaScript -->
      </div>

    </aside>

  </div>

    "url": "https://embedsports.me/history-channel-stream-1/embed/",
    "eventSubtitle": "Ancient Civilizations & World History",
    "qualityBadge": "FHD",
    "isTopTen": false
  },
  {
    "id": "nasa_tv",
    "name": "NASA TV HD",
    "network": "NASA",
    "group": "Docs & Cinema",
    "url": "https://ntv1.akamaized.net/hls/live/2014075/NASA-NTV1-HLS/master.m3u8",
    "eventSubtitle": "Live Space Station & Rocket Launches",
    "qualityBadge": "1080p",
    "isTopTen": false
  },
  {
    "id": "sky_cinema",
    "name": "Sky Cinema Action",
    "network": "Sky Cinema",
    "group": "Docs & Cinema",
    "url": "https://embedsports.me/sky-cinema-action-stream-1/embed/",
    "eventSubtitle": "Blockbuster Hollywood Action 24/7",
    "qualityBadge": "FHD",
    "isTopTen": false
  },
  {
    "id": "hbo_premiere",
    "name": "HBO Premiere Cinema",
    "network": "HBO",
    "group": "Docs & Cinema",
    "url": "https://embedsports.me/hbo-stream-1/embed/",
    "eventSubtitle": "Award Winning Feature Films & Series",
    "qualityBadge": "4K",
    "isTopTen": false
  },
  {
    "id": "paramount_net",
    "name": "Paramount Network HD",
    "network": "Paramount",
    "group": "Docs & Cinema",
    "url": "https://embedsports.me/paramount-network-stream-1/embed/",
    "eventSubtitle": "Hit Dramas, Series & Classic Movies",
    "qualityBadge": "HD",
    "isTopTen": false
  },
  {
    "id": "warner_tv",
    "name": "Warner TV Cinema",
    "network": "Warner",
    "group": "Docs & Cinema",
    "url": "https://embedsports.me/warner-tv-stream-1/embed/",
    "eventSubtitle": "Warner Bros Premier Movies & Classics",
    "qualityBadge": "FHD",
    "isTopTen": false
  }
];

    // State
    let currentChannel = CHANNELS[0];
    let selectedCategory = "Top 10 Matches";
    let searchQuery = "";
    let favorites = new Set(JSON.parse(localStorage.getItem("novastream_favs") || "[]"));
    let hlsInstance = null;

    // DOM Elements
    const hlsVideo = document.getElementById("hls-video");
    const embedFrame = document.getElementById("embed-frame");
    const playerLoader = document.getElementById("player-loader");
    const channelContainer = document.getElementById("channel-container");
    const searchInput = document.getElementById("channel-search");
    const clearSearchBtn = document.getElementById("clear-search");
    const categoryTabs = document.querySelectorAll(".cat-chip");
    
    const nowPlayingTitle = document.getElementById("now-playing-title");
    const nowPlayingNetwork = document.getElementById("now-playing-network");
    const nowPlayingQuality = document.getElementById("now-playing-quality");
    const nowPlayingSubtitle = document.getElementById("now-playing-subtitle");
    
    const btnReload = document.getElementById("btn-reload");
    const btnTheater = document.getElementById("btn-theater");
    const btnFavorite = document.getElementById("btn-favorite");
    const channelCountBadge = document.getElementById("channel-count-badge");

    // Initialize
    function init() {
      channelCountBadge.textContent = `${CHANNELS.length} LIVE`;
      setupEventListeners();
      renderChannels();
      playChannel(CHANNELS[0]);
    }

    function setupEventListeners() {
      // Search
      searchInput.addEventListener("input", (e) => {
        searchQuery = e.target.value.trim().toLowerCase();
        clearSearchBtn.style.display = searchQuery ? "block" : "none";
        renderChannels();
      });

      clearSearchBtn.addEventListener("click", () => {
        searchInput.value = "";
        searchQuery = "";
        clearSearchBtn.style.display = "none";
        renderChannels();
      });

      // Category Switcher
      categoryTabs.forEach(tab => {
        tab.addEventListener("click", () => {
          categoryTabs.forEach(t => t.classList.remove("active"));
          tab.classList.add("active");
          selectedCategory = tab.dataset.category;
          renderChannels();
        });
      });

      // Reload
      btnReload.addEventListener("click", () => {
        if (currentChannel) playChannel(currentChannel);
      });

      // Fullscreen
      btnTheater.addEventListener("click", () => {
        const target = currentChannel && isHlsStream(currentChannel.url) ? hlsVideo : embedFrame;
        if (!document.fullscreenElement) {
          if (target.requestFullscreen) target.requestFullscreen();
          else if (target.webkitRequestFullscreen) target.webkitRequestFullscreen();
        } else {
          if (document.exitFullscreen) document.exitFullscreen();
        }
      });

      // Favorite Current
      btnFavorite.addEventListener("click", () => {
        if (!currentChannel) return;
        toggleFavorite(currentChannel.id);
        updateFavoriteButtonState();
        if (selectedCategory === "Favorites") renderChannels();
      });

      // Keyboard navigation
      window.addEventListener("keydown", (e) => {
        if (e.target.tagName === "INPUT") return;
        if (e.key === "f" || e.key === "F") btnTheater.click();
        if (e.key === "r" || e.key === "R") btnReload.click();
      });
    }

    function isHlsStream(url) {
      const lower = url.toLowerCase();
      return lower.includes(".m3u8");
    }

    function playChannel(channel) {
      currentChannel = channel;
      updateHeaderMetadata(channel);
      updateFavoriteButtonState();

      // Show loader
      playerLoader.style.display = "flex";

      if (isHlsStream(channel.url)) {
        // HLS Player Mode
        embedFrame.style.display = "none";
        embedFrame.src = "about:blank";
        hlsVideo.style.display = "block";

        if (Hls.isSupported()) {
          if (hlsInstance) hlsInstance.destroy();
          hlsInstance = new Hls({ enableWorker: true, lowLatencyMode: true });
          hlsInstance.loadSource(channel.url);
          hlsInstance.attachMedia(hlsVideo);
          hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
            hlsVideo.play().catch(() => {});
            playerLoader.style.display = "none";
          });
          hlsInstance.on(Hls.Events.ERROR, () => {
            playerLoader.style.display = "none";
          });
        } else if (hlsVideo.canPlayType("application/vnd.apple.mpegurl")) {
          // iOS Safari native HLS
          hlsVideo.src = channel.url;
          hlsVideo.addEventListener("loadedmetadata", () => {
            hlsVideo.play().catch(() => {});
            playerLoader.style.display = "none";
          });
        }
      } else {
        // Embed Player Mode
        if (hlsInstance) {
          hlsInstance.destroy();
          hlsInstance = null;
        }
        hlsVideo.pause();
        hlsVideo.style.display = "none";
        hlsVideo.src = "";

        embedFrame.style.display = "block";
        embedFrame.src = channel.url;
        embedFrame.onload = () => {
          playerLoader.style.display = "none";
        };
      }

      // Mark active in DOM
      document.querySelectorAll(".channel-card").forEach(card => {
        if (card.dataset.id === channel.id) {
          card.classList.add("active");
          card.scrollIntoView({ behavior: "smooth", block: "nearest" });
        } else {
          card.classList.remove("active");
        }
      });
    }

    function updateHeaderMetadata(channel) {
      nowPlayingTitle.textContent = channel.name;
      nowPlayingNetwork.textContent = channel.network || "Live";
      nowPlayingQuality.textContent = channel.qualityBadge || "HD";
      nowPlayingSubtitle.innerHTML = `<i class="ph ph-broadcast"></i> <span>${channel.eventSubtitle || "Live Broadcast"}</span>`;
    }

    function toggleFavorite(channelId) {
      if (favorites.has(channelId)) {
        favorites.delete(channelId);
      } else {
        favorites.add(channelId);
      }
      localStorage.setItem("novastream_favs", JSON.stringify(Array.from(favorites)));
    }

    function updateFavoriteButtonState() {
      if (currentChannel && favorites.has(currentChannel.id)) {
        btnFavorite.classList.add("active");
      } else {
        btnFavorite.classList.remove("active");
      }
    }

    function renderChannels() {
      channelContainer.innerHTML = "";

      let filtered = CHANNELS.filter(c => {
        // Filter by category
        if (selectedCategory === "Top 10 Matches") {
          if (!c.isTopTen) return false;
        } else if (selectedCategory === "Favorites") {
          if (!favorites.has(c.id)) return false;
        } else if (selectedCategory !== "ALL") {
          if (c.group !== selectedCategory) return false;
        }

        // Filter by search query
        if (searchQuery) {
          const term = `${c.name} ${c.network} ${c.group} ${c.eventSubtitle}`.toLowerCase();
          if (!term.includes(searchQuery)) return false;
        }

        return true;
      });

      if (filtered.length === 0) {
        channelContainer.innerHTML = `
          <div class="empty-state">
            <i class="ph ph-television-simple"></i>
            <p>No channels found</p>
          </div>
        `;
        return;
      }

      filtered.forEach(channel => {
        const card = document.createElement("div");
        card.className = `channel-card ${currentChannel && currentChannel.id === channel.id ? "active" : ""}`;
        card.dataset.id = channel.id;

        const isFav = favorites.has(channel.id);
        const initials = channel.network.slice(0, 3).toUpperCase();

        card.innerHTML = `
          <div class="card-left">
            <div class="network-badge-box">${initials}</div>
            <div class="card-meta">
              <span class="card-title">${channel.name}</span>
              <span class="card-subtitle">${channel.eventSubtitle}</span>
            </div>
          </div>
          <div class="card-right">
            <span class="badge badge-quality" style="font-size:0.65rem; padding:0.15rem 0.35rem;">${channel.qualityBadge}</span>
            <button class="card-fav-btn ${isFav ? "is-fav" : ""}" title="Favorite">
              <i class="${isFav ? "ph-fill" : "ph"} ph-star"></i>
            </button>
          </div>
        `;

        card.addEventListener("click", (e) => {
          if (e.target.closest(".card-fav-btn")) return;
          playChannel(channel);
        });

        const favBtn = card.querySelector(".card-fav-btn");
        favBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          toggleFavorite(channel.id);
          favBtn.classList.toggle("is-fav");
          const icon = favBtn.querySelector("i");
          icon.className = favorites.has(channel.id) ? "ph-fill ph-star" : "ph ph-star";
          updateFavoriteButtonState();
          if (selectedCategory === "Favorites") renderChannels();
        });

        channelContainer.appendChild(card);
      });
    }

    window.addEventListener("DOMContentLoaded", init);
  </script>
</body>
